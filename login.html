<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CivicVote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <span class="seal">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E4D2AE" stroke-width="1.6"><path d="M12 2l7 3v6c0 5-3.4 8.6-7 10-3.6-1.4-7-5-7-10V5l7-3z"/><path d="M9 12l2 2 4-4.2"/></svg>
      </span>
      <span class="eyebrow">Voter Access</span>
      <h1 style="font-size:1.7rem; margin-top:.2em;">Login to CivicVote</h1>
      <p style="margin:0;">Enter your Voter ID and password to continue.</p>
    </div>

    <div class="form-msg" id="login-msg"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="voterId">Username (Voter ID)</label>
        <input type="text" id="voterId" name="voterId" placeholder="e.g. VOT10234" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="auth-foot">
      Not registered yet? <a href="register.html">Create a voter account</a>
    </div>

    <div class="demo-note">
      DEMO ADMIN LOGIN &mdash; Voter ID: ADMIN001 &middot; Password: admin123<br>
      Register your own voter account to try the voting flow.
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="script.js"></script>
<script>
  renderNav('login');
  renderFooter();
  redirectIfLoggedIn();

  const form = document.getElementById("login-form");
  const msg = document.getElementById("login-msg");

  form.addEventListener("submit", function(e){
    e.preventDefault();
    const voterId = document.getElementById("voterId").value.trim();
    const password = document.getElementById("password").value;

    if(!voterId || !password){
      showMsg(msg, "Please fill in both fields.", "error");
      return;
    }

    const result = loginUser(voterId, password);
    if(!result.ok){
      showMsg(msg, result.message, "error");
      return;
    }

    showMsg(msg, "Login successful. Redirecting…", "success");
    setTimeout(() => {
      window.location.href = result.user.role === "admin" ? "admin.html" : "dashboard.html";
    }, 500);
  });
</script>
</body>
</html>
