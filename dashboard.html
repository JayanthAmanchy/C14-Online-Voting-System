<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — CivicVote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-nav"></div>

<header class="page-head">
  <div class="container">
    <span class="eyebrow">Voter Dashboard</span>
    <h1 id="welcome-heading">Welcome back</h1>
    <p id="welcome-sub">Here's your voting activity at a glance.</p>
  </div>
</header>

<main class="app-main">
  <div class="container">

    <div id="status-banner"></div>

    <div class="action-grid">
      <a href="voting.html" class="action-card" id="vote-action">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span>
        <h3>Cast Your Vote</h3>
        <p>View candidates and submit your ballot.</p>
      </a>
      <a href="profile.html" class="action-card">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></span>
        <h3>My Profile</h3>
        <p>Review your registration details.</p>
      </a>
      <a href="results.html" class="action-card">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></span>
        <h3>Live Results</h3>
        <p>See current vote counts and leader.</p>
      </a>
      <button class="action-card" id="logout-action" style="text-align:left; font-family:inherit;">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></span>
        <h3>Logout</h3>
        <p>Sign out of your voter account.</p>
      </button>
    </div>

    <div class="perforation" style="margin:44px 0;"></div>

    <div class="card">
      <span class="eyebrow" id="election-eyebrow">Current Election</span>
      <h2 id="election-title" style="margin-top:.2em;">—</h2>
      <p id="election-status-text">—</p>
    </div>

  </div>
</main>

<div id="site-footer"></div>

<script src="script.js"></script>
<script>
  renderNav('dashboard');
  renderFooter();
  const user = requireAuth();

  if(user){
    document.getElementById("welcome-heading").textContent = "Welcome, " + user.name.split(" ")[0] + ".";
    document.getElementById("welcome-sub").textContent = "Voter ID " + user.voterId + " — here's your voting activity at a glance.";

    const banner = document.getElementById("status-banner");
    const voteAction = document.getElementById("vote-action");
    if(user.hasVoted){
      banner.innerHTML = `<div class="status-banner voted">✓ You have already cast your vote. Thank you for participating.</div>`;
      voteAction.querySelector("p").textContent = "You've already voted — view results instead.";
    } else {
      banner.innerHTML = `<div class="status-banner not-voted">⏳ You haven't voted yet. Your voice is still needed.</div>`;
    }

    const election = getElection();
    document.getElementById("election-title").textContent = election.title;
    document.getElementById("election-status-text").textContent = election.open
      ? "Polls are currently open. Cast your vote before the election closes."
      : "Polls are currently closed. View the final results.";
  }

  document.getElementById("logout-action").addEventListener("click", logoutUser);
</script>
</body>
</html>
