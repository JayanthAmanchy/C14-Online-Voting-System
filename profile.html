<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — CivicVote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-nav"></div>

<header class="page-head">
  <div class="container">
    <span class="eyebrow">Voter Record</span>
    <h1>My Profile</h1>
    <p>Your registration details on file with CivicVote.</p>
  </div>
</header>

<main class="app-main">
  <div class="container" style="max-width:820px;">
    <div class="profile-grid">

      <div class="card profile-side">
        <div class="profile-avatar" id="profile-avatar">--</div>
        <h3 id="profile-name">—</h3>
        <div class="vid" id="profile-voterid">—</div>
        <div class="perforation"></div>
        <div id="profile-vote-badge"></div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:16px;">Registration Details</h3>
        <div class="info-row"><span class="k">Full Name</span><span class="v" id="row-name">—</span></div>
        <div class="info-row"><span class="k">Voter ID</span><span class="v" id="row-voterid">—</span></div>
        <div class="info-row"><span class="k">Age</span><span class="v" id="row-age">—</span></div>
        <div class="info-row"><span class="k">Email</span><span class="v" id="row-email">—</span></div>
        <div class="info-row"><span class="k">Registered On</span><span class="v" id="row-created">—</span></div>
        <div class="info-row"><span class="k">Voting Status</span><span class="v" id="row-status">—</span></div>

        <div class="perforation"></div>

        <h3 style="margin-bottom:16px;">Update Password</h3>
        <div class="form-msg" id="profile-msg"></div>
        <form id="password-form">
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>
          </div>
          <div class="field">
            <label for="confirmNewPassword">Confirm new password</label>
            <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required>
          </div>
          <button type="submit" class="btn btn-navy">Update Password</button>
        </form>
      </div>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="api.js"></script>
<script src="script.js"></script>
<script>
  const msg = document.getElementById("profile-msg");

  boot('profile').then(function(me){
    if (requireUser(me)) return;

    const user = me.user;

    document.getElementById("profile-avatar").textContent = initials(user.name);
    document.getElementById("profile-name").textContent = user.name;
    document.getElementById("profile-voterid").textContent = user.voter_id;

    document.getElementById("row-name").textContent = user.name;
    document.getElementById("row-voterid").textContent = user.voter_id;
    document.getElementById("row-age").textContent = user.age;
    document.getElementById("row-email").textContent = user.email;
    document.getElementById("row-created").textContent = me.created_at
      ? new Date(me.created_at + "T00:00:00").toLocaleDateString(undefined,
          { year: "numeric", month: "long", day: "numeric" })
      : "\u2014";

    const statusEl = document.getElementById("row-status");
    const badgeArea = document.getElementById("profile-vote-badge");

    if (me.has_voted) {
      statusEl.innerHTML = '<span class="badge success">Voted</span>';
      badgeArea.innerHTML = '<p style="margin:0; font-size:.85rem;">\u2713 Ballot cast for ' +
        escapeHtml(me.voted_for_name || "a candidate") + '</p>';
    } else {
      statusEl.innerHTML = '<span class="badge pending">Not yet voted</span>';
      badgeArea.innerHTML = me.election_open
        ? '<p style="margin:0; font-size:.85rem;">\u23f3 Awaiting your vote</p><a href="voting.html" class="btn btn-primary btn-sm" style="margin-top:10px;">Vote Now</a>'
        : '<p style="margin:0; font-size:.85rem;">\u23f3 Polls are currently closed</p>';
    }

    document.getElementById("password-form").addEventListener("submit", async function(e){
      e.preventDefault();
      clearMsg(msg);

      const p1 = document.getElementById("newPassword").value;
      const p2 = document.getElementById("confirmNewPassword").value;

      if (p1.length < 6) {
        showMsg(msg, "Password must be at least 6 characters.", "error");
        return;
      }
      if (p1 !== p2) {
        showMsg(msg, "Passwords do not match.", "error");
        return;
      }

      try {
        const result = await Api.changePassword(p1);
        // Changing the password rotates the session token server-side, so the
        // browser must adopt the new one or it will be signed out.
        if (result.token) localStorage.setItem("cv_token", result.token);
        showMsg(msg, "Password updated successfully.", "success");
        e.target.reset();
      } catch (error) {
        showMsg(msg, errorMessage(error), "error");
      }
    });
  });
</script>
</body>
</html>
