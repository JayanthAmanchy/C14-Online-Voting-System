<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Election Results — CivicVote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-nav"></div>

<header class="page-head">
  <div class="container">
    <span class="eyebrow" id="results-eyebrow">Live Tally</span>
    <h1>Election Results</h1>
    <p id="results-sub">Vote counts update as ballots are submitted.</p>
  </div>
</header>

<main class="app-main">
  <div class="container" style="max-width:800px;">

    <div id="winner-area"></div>

    <div id="table-area"></div>

  </div>
</main>

<div id="site-footer"></div>

<script src="script.js"></script>
<script>
  renderNav('results');
  renderFooter();
  requireAuth();

  function render(){
    const { candidates, totalVotes, winner } = getResults();
    const election = getElection();

    document.getElementById("results-sub").textContent = election.open
      ? "Polls are still open — totals may change as more voters cast their ballot."
      : "Polls are closed. These are the final certified results.";

    const winnerArea = document.getElementById("winner-area");
    if(winner && totalVotes > 0){
      const pct = Math.round((winner.votes / totalVotes) * 100);
      winnerArea.innerHTML = `
        <div class="winner-banner">
          <span class="seal">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="1.8"><path d="M12 2l7 3v6c0 5-3.4 8.6-7 10-3.6-1.4-7-5-7-10V5l7-3z"/><path d="M9 12l2 2 4-4.2"/></svg>
          </span>
          <div>
            <span class="eyebrow">${election.open ? "Currently Leading" : "Declared Winner"}</span>
            <h2>${escapeHtml(winner.name)}</h2>
            <p>${escapeHtml(winner.party)} &middot; ${winner.votes} vote${winner.votes===1?"":"s"} (${pct}% of ballots cast)</p>
          </div>
        </div>
      `;
    } else {
      winnerArea.innerHTML = `
        <div class="card" style="text-align:center; margin-bottom:32px;">
          <p style="margin:0;">No votes have been cast yet. Results will appear here once voting begins.</p>
        </div>
      `;
    }

    const tableArea = document.getElementById("table-area");
    if(candidates.length === 0){
      tableArea.innerHTML = `<div class="empty-state card"><p>No candidates in this election.</p></div>`;
      return;
    }

    const maxVotes = Math.max(1, ...candidates.map(c => c.votes));
    tableArea.innerHTML = `
      <table class="results-table">
        <thead>
          <tr><th>Rank</th><th>Candidate</th><th>Party</th><th>Votes</th></tr>
        </thead>
        <tbody>
          ${candidates.map((c,i) => `
            <tr>
              <td><span class="rank-badge ${i===0 && c.votes>0 ? 'first' : ''}">${i+1}</span></td>
              <td>
                <strong>${escapeHtml(c.name)}</strong>
                <div class="bar-track"><div class="bar-fill" style="width:${(c.votes/maxVotes)*100}%"></div></div>
              </td>
              <td>${escapeHtml(c.party)}</td>
              <td class="count">${c.votes}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  render();
</script>
</body>
</html>
